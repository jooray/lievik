error_session_ended:
  en: Your session ended. Please sign in again.
  sk: Vaše prihlásenie skončilo. Prihláste sa znova.
  cs: Vaše přihlášení skončilo. Přihlaste se znovu.
  es: Tu sesión ha terminado. Vuelve a iniciar sesión.
error_unexpected:
  en: The server sent a response the app can't read.
  sk: Server poslal odpoveď, ktorej aplikácia nerozumie.
  cs: Server poslal odpověď, které aplikace nerozumí.
  es: El servidor envió una respuesta que la app no puede leer.
error_server:
  en: Something went wrong on the server (%1$d). Try again in a moment.
  sk: Na serveri sa niečo pokazilo (%1$d). Skúste to o chvíľu znova.
  cs: Na serveru se něco pokazilo (%1$d). Zkuste to za chvíli znovu.
  es: Algo salió mal en el servidor (%1$d). Inténtalo de nuevo en un momento.
error_rate_limited:
  en: Too many requests. Wait a moment and try again.
  sk: Príliš veľa požiadaviek. Chvíľu počkajte a skúste to znova.
  cs: Příliš mnoho požadavků. Chvíli počkejte a zkuste to znovu.
  es: Demasiadas solicitudes. Espera un momento e inténtalo de nuevo.

offline_title: {en: You're offline, sk: Ste offline, cs: Jste offline, es: Estás sin conexión}
offline_body:
  en: This needs a connection to the server. Everything already synced is still available.
  sk: Toto potrebuje spojenie so serverom. Všetko, čo je už synchronizované, máte stále k dispozícii.
  cs: Tohle potřebuje spojení se serverem. Vše, co už je synchronizované, máte stále k dispozici.
  es: Esto necesita conexión con el servidor. Todo lo ya sincronizado sigue disponible.
offline_banner:
  en: Offline — showing saved data
  sk: Offline – zobrazujú sa uložené údaje
  cs: Offline – zobrazují se uložená data
  es: Sin conexión, mostrando datos guardados

sync_now: {en: Sync now, sk: Synchronizovať, cs: Synchronizovat, es: Sincronizar ahora}
sync_last:
  en: Last synced %1$s
  sk: Naposledy synchronizované %1$s
  cs: Naposledy synchronizováno %1$s
  es: Última sincronización %1$s
sync_never: {en: Not synced yet, sk: Zatiaľ nesynchronizované, cs: Zatím nesynchronizováno, es: Aún sin sincronizar}
sync_running: {en: Syncing…, sk: Synchronizuje sa…, cs: Synchronizuje se…, es: Sincronizando…}
sync_full: {en: Download everything again, sk: Stiahnuť všetko znova, cs: Stáhnout vše znovu, es: Descargar todo de nuevo}
sync_full_hint:
  en: Clears the data saved on this phone and syncs it again from the server.
  sk: Vymaže údaje uložené v tomto telefóne a znova ich synchronizuje zo servera.
  cs: Smaže data uložená v tomto telefonu a znovu je synchronizuje ze serveru.
  es: Borra los datos guardados en este teléfono y los vuelve a sincronizar desde el servidor.
sync_failed:
  en: Sync failed. Showing saved data.
  sk: Synchronizácia zlyhala. Zobrazujú sa uložené údaje.
  cs: Synchronizace selhala. Zobrazují se uložená data.
  es: La sincronización falló. Mostrando datos guardados.

update_required_title: {en: Update required, sk: Je potrebná aktualizácia, cs: Je nutná aktualizace, es: Actualización necesaria}
update_required_body:
  en: This version of Lievik is too old for the server. Install the latest version to continue.
  sk: Táto verzia Lieviku je pre server príliš stará. Ak chcete pokračovať, nainštalujte si najnovšiu verziu.
  cs: Tato verze Lieviku je pro server příliš stará. Chcete-li pokračovat, nainstalujte si nejnovější verzi.
  es: Esta versión de Lievik es demasiado antigua para el servidor. Instala la última versión para continuar.
update_download: {en: Download update, sk: Stiahnuť aktualizáciu, cs: Stáhnout aktualizaci, es: Descargar actualización}
update_available:
  en: A new version of Lievik is available.
  sk: Je dostupná nová verzia Lieviku.
  cs: Je k dispozici nová verze Lieviku.
  es: Hay una nueva versión de Lievik disponible.
update_later: {en: Later, sk: Neskôr, cs: Později, es: Más tarde}

login_this_phone_heading: {en: Signer on this phone, sk: Podpisovač v tomto telefóne, cs: Podepisovač v tomto telefonu, es: Firmante en este teléfono}
login_sign_in_with: {en: Sign in with %1$s, sk: Prihlásiť sa cez %1$s, cs: Přihlásit se přes %1$s, es: Iniciar sesión con %1$s}
login_nip55_hint:
  en: "The signer asks twice: to share your public key, then to sign the login request."
  sk: "Podpisovač sa opýta dvakrát: či môže zdieľať váš verejný kľúč a potom či môže podpísať žiadosť o prihlásenie."
  cs: "Podepisovač se zeptá dvakrát: zda může sdílet váš veřejný klíč a potom zda může podepsat žádost o přihlášení."
  es: "El firmante te preguntará dos veces: para compartir tu clave pública y para firmar la solicitud de inicio de sesión."
login_no_signer:
  en: No signer app is installed on this phone. Install Amber, or connect a signer on another device below.
  sk: V tomto telefóne nie je nainštalovaný žiadny podpisovač. Nainštalujte si Amber alebo nižšie pripojte podpisovač na inom zariadení.
  cs: V tomto telefonu není nainstalovaný žádný podepisovač. Nainstalujte si Amber nebo níže připojte podepisovač na jiném zařízení.
  es: No hay ninguna app firmante instalada en este teléfono. Instala Amber o conecta abajo un firmante en otro dispositivo.
login_get_amber: {en: Get Amber, sk: Stiahnuť Amber, cs: Stáhnout Amber, es: Obtener Amber}
login_signer_cancelled:
  en: The signer did not return a signature.
  sk: Podpisovač nevrátil podpis.
  cs: Podepisovač nevrátil podpis.
  es: El firmante no devolvió una firma.
login_signer_rejected:
  en: Signing was cancelled in the signer app.
  sk: Podpisovanie bolo v podpisovači zrušené.
  cs: Podepisování bylo v podepisovači zrušeno.
  es: Se canceló la firma en la app firmante.
login_hide_qr: {en: Hide QR code, sk: Skryť QR kód, cs: Skrýt QR kód, es: Ocultar código QR}
login_qr_description: {en: QR code for your signer app, sk: QR kód pre podpisovač, cs: QR kód pro podepisovač, es: Código QR para tu app firmante}
login_advanced: {en: Advanced, sk: Rozšírené, cs: Pokročilé, es: Avanzado}
login_server_label: {en: Server, sk: Server, cs: Server, es: Servidor}
login_server_hint:
  en: For a self-hosted Lievik. Keep the default to use lievik.cypherpunk.today.
  sk: Pre vlastnú inštaláciu Lieviku. Ak chcete používať lievik.cypherpunk.today, ponechajte predvolenú hodnotu.
  cs: Pro vlastní instalaci Lieviku. Chcete-li používat lievik.cypherpunk.today, ponechte výchozí hodnotu.
  es: Para un Lievik autoalojado. Deja el valor predeterminado para usar lievik.cypherpunk.today.
login_server_invalid:
  en: Enter an address that starts with https://
  sk: Zadajte adresu, ktorá začína https://
  cs: Zadejte adresu, která začíná https://
  es: Introduce una dirección que empiece por https://
login_server_insecure:
  en: Without https:// your login travels unencrypted.
  sk: Bez https:// sa prihlásenie posiela nešifrované.
  cs: Bez https:// se přihlášení posílá nešifrovaně.
  es: Sin https:// tu inicio de sesión viaja sin cifrar.
login_server_reset: {en: Use default, sk: Použiť predvolený, cs: Použít výchozí, es: Usar el predeterminado}

