sk:
  pages:
    landing:
      title: "Lievik: správny obsah pre správne obecenstvo"
      meta_description: "Lievik pomáha tvorcom na Nostri dostať obsah k ľuďom, ktorých naozaj zaujíma."
      home_label: "Lievik, úvodná stránka"
      github_label: "Zdrojový kód na GitHube"
      theme_label: "Prepnúť farebný režim"
      language_label: "Jazyk"
      nav_launch: "Spustiť"
      nav_pricing: "Cenník"
      hero:
        eyebrow: "Kurátorstvo obsahu pre Nostr"
        headline_html: "Správny obsah<br />pre <em>správne obecenstvo.</em>"
        lede: "V Lieviku si v pokoji ujasníte, kto čo potrebuje počuť. Natiahnite doň, čo publikujete, aj zdroje, ktoré sledujete, opíšte ľudí, pre ktorých píšete, a Lievik vám ukáže, čo stojí za to poslať komu."
        launch: "Spustiť Lievik"
        see_how: "Ako to funguje"
        quiet_note: "Prihlásite sa Nostr identitou, e-mail ani heslo netreba."
      desk:
        aria_label: "Ukážka, ako Lievik priraďuje Nostr príspevok publiku"
        label: "Váš triediaci pult"
        source_kicker: "Niečo, čo ste vytvorili"
        note_byline: "Mara zverejnila príspevok"
        note_meta: "Nostr · pred 2 hodinami"
        note_copy: "Krátky návod, ako vybrať súkromný messenger pre rodinnú skupinu. Na čo si dať pozor a nad čím netreba dlho premýšľať."
        note_link: "dlhý článok · 6 min čítania"
        audience_kicker: "Kto by to mal počuť?"
        channel_privacy: "Kurz o súkromí"
        channel_privacy_who: "študenti a absolventi"
        channel_meetup: "Miestny meetup"
        channel_meetup_who: "bitcoinoví začiatočníci"
        channel_project: "Novinky z projektu"
        channel_project_who: "prispievatelia do open source"
        ready: "Pripravené do newslettera kurzu o súkromí"
      statement:
        eyebrow: "Lepšia otázka"
        heading: "Obsah sa stráca, keď všetky publiká nosíte len v hlave."
        copy: "Newsletter, kurz, chatová skupina: každé miesto má vlastný kontext a ten dnes poznáte len vy. Lievik ten zoznam v hlave nahradí niečím, čo si pamätá, čo ktorú skupinu zaujíma a čo ste jej už poslali."
        make:
          label: "01 / TVORIŤ"
          title: "Niečo ste vytvorili"
          copy: "Nájdite ľudí, ktorým to naozaj patrí. Netreba to trúbiť do sveta ani nechať ležať v šuplíku."
        speak:
          label: "02 / OSLOVIŤ"
          title: "Máte koho osloviť"
          copy: "V ich kanáli uvidíte užitočné veci, ktoré od vás ešte nepočuli."
        remember:
          label: "03 / PAMÄTAŤ"
          title: "Už ste to raz robili"
          copy: "Majte prehľad, čo ste ktorej skupine poslali. Pri ďalšej správe nebudete hádať, budete to vedieť."
      how:
        eyebrow: "Ako Lievik funguje"
        heading: "Jedno miesto pre všetky vaše rozhovory."
        subheading: "Stavia na tom, ako tvorcovia na Nostri už dnes publikujú a sledujú sa navzájom."
        gather:
          title: "Zozbierajte signál"
          copy: "Pridajte svoju Nostr identitu, ľudí, ktorých sledujete, a RSS feedy, ktorým veríte. Ich poznámky, články aj odkazy sa zbehnú na jednom mieste."
        name:
          title: "Pomenujte publiká"
          copy: "Vytvorte kanály pre skutočné skupiny, ktorým píšete, a vlastnými slovami opíšte, čo ich zaujíma."
        share:
          title: "Zdieľajte s rozmyslom"
          copy: "Lievik zoradí, čo je relevantné, pomôže vám s konceptom správy a zapamätá si, čo ste už použili."
      install:
        eyebrow: "Telefón, tablet, počítač"
        heading: "Nainštalujte si ho ako aplikáciu, na akomkoľvek zariadení."
        subheading: "Lievik je webová aplikácia, ktorú si pridáte na plochu. Otvorí sa vo vlastnom okne a má všetky funkcie na iPhone, iPade, Androide aj v počítači. Z obchodu s aplikáciami nemusíte sťahovať nič."
        web:
          label: "Webová aplikácia"
          title: "Celá aplikácia, všade"
          copy: "Nainštalovaná webová aplikácia je ten istý Lievik ako v prehliadači. Aktualizuje sa sama, takže máte vždy najnovšiu verziu."
          ios_html: "<strong>iPhone a iPad:</strong> otvorte Lievik v Safari, ťuknite na Zdieľať a potom na Pridať na plochu."
          other: "Android a počítač: v ponuke prehliadača zvoľte Inštalovať aplikáciu."
        native:
          label: "Voliteľné"
          title: "Chcete radšej natívnu aplikáciu pre Android?"
          copy: "Aj taká existuje. Vie to isté a prihlásite sa v nej cez Amber alebo iný Nostr podpisovač v telefóne."
          zapstore: "Zapstore"
          obtainium: "Obtainium"
          github: "Stiahnuť z GitHubu"
        android:
          heading: "Lievik vo vašom telefóne s Androidom."
          subheading: "Stiahnite si natívnu aplikáciu. Ak chcete, funguje aj webová aplikácia."
          native_label: "Odporúčame pre Android"
          native_title: "Natívna aplikácia pre Android"
          native_copy: "Vie všetko, čo webová aplikácia. Prihlásite sa cez Amber alebo iný Nostr podpisovač v tomto telefóne."
          web_title: "Funguje aj webová aplikácia"
      pricing:
        eyebrow: "Cenník"
        heading: "Tri dni zadarmo. Ak sa osvedčí, zaplatíte v satoch."
        subheading: "Účtom je váš Nostr kľúč. Žiadny e-mail, karta ani predplatné, ktoré treba rušiť."
        lievik:
          label: "LIEVIK"
          price: "3 dni zadarmo"
          then: "potom 15 000 satov za 30 dní"
          trial: "Skúška sa spustí, keď prvýkrát pridáte zdroj, obnovíte ho, necháte ohodnotiť príspevky alebo sa spýtate AI. Samotné prihlásenie ju nespustí."
          paused: "Bez skúšky alebo zaplateného času Lievik prestane sťahovať a hodnotiť príspevky. Prihlásiť sa a pozrieť si, čo ste nazbierali, môžete stále."
          pro_rata: "Zaplatiť môžete ľubovoľnú sumu cez Lightning, pripíše sa po dňoch: 7 500 satov je 15 dní, minimum 1 000."
          keep_days: "Ak zaplatíte počas skúšky, nevyčerpané dni vám zostanú."
        bundle:
          label: "VŠETKY APLIKÁCIE"
          price: "25 000 satov"
          then: "za 30 dní, pre tri aplikácie"
          covers_html: "Lievik, hostovaný <a href=\"https://nalgorithm.cypherpunk.today\">nalgorithm</a> (zoradený Nostr feed a hlasové prehľady) a písanie s AI v <a href=\"https://emanator.cypherpunk.today\">Emanatore</a> (plánovač príspevkov na Nostr)."
          saving: "Samostatne by stáli 35 000 satov."
          keep_days: "Dni, ktoré už máte zaplatené v ktorejkoľvek z nich, vám zostanú."
        self_host:
          label: "VLASTNÝ SERVER"
          price: "Zadarmo"
          then: "s vlastným kľúčom k AI"
          copy_html: "Lievik je open source. <a href=\"https://github.com/jooray/lievik\">Spustite si ho sami</a> a žiadne platby sa vás netýkajú."
        terms_html: "Skúšobná doba, vrátenie peňazí, súkromie a podpora: <a href=\"https://cypherpunk.today/sk/terms/\">podmienky</a>."
      closing:
        eyebrow: "Doma na Nostri"
        heading: "Nech má každý pocit, že správa bola písaná práve preňho."
        launch: "Spustiť aplikáciu"
      footer:
        tagline: "© Lievik. Správny obsah pre správne obecenstvo."
        sign_in: "Prihláste sa cez NIP-07 alebo vzdialený podpisovač NIP-46."
        github: "Open source na GitHube"
